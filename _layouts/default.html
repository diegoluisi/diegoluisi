<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071512">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{ site.author.name }}",
        "jobTitle": "{{ site.author.role }}",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "image": "{{ '/images/profile.png' | absolute_url }}",
        "email": "mailto:{{ site.author.email }}",
        "address": {"@type": "PostalAddress", "addressLocality": "Lisbon", "addressCountry": "PT"},
        "sameAs": ["{{ site.author.linkedin }}", "{{ site.author.github }}", "{{ site.author.website }}", "{{ site.author.youtube }}"]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Diego Luisi, home">
        <span class="brand__mark">DL</span>
        <span><strong>Diego Luisi</strong><small>Lead Platform Engineer</small></span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#profile">Profile</a>
        <a href="#core-skills">Expertise</a>
        <a href="#professional-experience">Experience</a>
        <a href="#education">Education</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme">
          <span class="theme-icon" aria-hidden="true">◐</span>
        </button>
        <a class="header-contact" href="mailto:{{ site.author.email }}">Let’s talk <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <div>
        <p class="eyebrow">Let’s build dependable platforms</p>
        <h2>Have a platform challenge?</h2>
      </div>
      <div class="footer-links">
        <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        <a href="{{ site.author.linkedin }}" rel="me">LinkedIn ↗</a>
        <a href="{{ site.author.github }}" rel="me">GitHub ↗</a>
      </div>
      <p class="footer-meta">© <span data-year></span> Diego Luisi · Built as code, deployed with GitHub Pages.</p>
    </footer>
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </body>
</html>
